<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkMakeup — Create Your Bio Link Page</title>
    <meta name="description" content="Create your custom bio link page, showcase social links, portfolio, and custom themes." />
    <meta property="og:title" content="LinkMakeup — Create Your Bio Link Page" />
    <meta property="og:description" content="Create your custom bio link page, showcase social links, portfolio, and custom themes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@900&display=swap" rel="stylesheet">
    <script>
      (function () {
        var stored = localStorage.getItem('linkmakeup-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
